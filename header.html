<header class="border-b border-zinc-800/60 bg-zinc-950/60 sticky top-0 backdrop-blur">
  <!-- Cookie Consent Banner -->
  <div id="cookie-consent-banner" style="position:fixed;bottom:0;left:0;width:100%;background:#222;color:#fff;padding:1em;z-index:9999;display:none;justify-content:center;align-items:center;gap:1em;">
    <span>This site only uses cookies for internal analytics (Microsoft Clarity) and others for some cool features, never for marketing. Do you accept?</span>
    <button id="accept-cookies" style="background:#4caf50;color:#fff;border:none;padding:0.5em 1em;cursor:pointer;">Accept</button>
    <button id="decline-cookies" style="background:#f44336;color:#fff;border:none;padding:0.5em 1em;cursor:pointer;">Decline</button>
  </div>

  <nav id="nav-header" class="w-full max-w-full overflow-x-auto px-4 md:px-6 py-4 flex items-center justify-between mt-1">
    <a href="/" class="site-title font-bold tracking-wide text-zinc-100">NODE_ZERO</a>
    <ul class="nav-links flex gap-4 text-sm text-zinc-300 items-center" style="list-style:none; margin:0; padding:0;">
      <li><a href="/primer/index.html">Primer</a></li>
      <li><a href="/artefacts/index.html">Artefacts</a></li>
      <li><a href="/stories/index.html">Stories</a></li>
      <li><a href="/the-blue/index.html">The Blue</a></li>
      <li><a href="/signals/index.html">Signals</a></li>
      <li><a href="/dev/index.html">dev</a></li>
      <li>
        <div id="carrier_detection"
          class="inline-flex items-center gap-2 rounded-full border border-zinc-700/60 bg-zinc-900/40 px-3 py-1 text-xs uppercase tracking-wider text-zinc-300">
          <span id="carrier_status_light" class="h-2 w-2 rounded-full animate-pulse"></span>
          <span id="carrier_status_label">Carrier detected</span>
        </div>
      </li>
    </ul>
  </nav>
 
 
  <!-- Clarity, Cookie Consent, and Carrier Detection Logic -->
  <script>
    // Show banner if consent not given
    function hasConsent() {
      return localStorage.getItem('clarityConsent') === 'accepted';
    }
    function hasDeclined() {
      return localStorage.getItem('clarityConsent') === 'declined';
    }
    function showBanner() {
      document.getElementById('cookie-consent-banner').style.display = 'flex';
    }
    function hideBanner() {
      document.getElementById('cookie-consent-banner').style.display = 'none';
    }
    function loadClarity() {
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "t77geqkdbb");
    }

    // Carrier detection indicator logic
    function updateCarrierIndicator() {
      var light = document.getElementById('carrier_status_light');
      var label = document.getElementById('carrier_status_label');
      if (!light || !label) return;
      if (typeof window.ethereum !== 'undefined' && window.ethereum.isMetaMask) {
        light.style.backgroundColor = '#34d399'; // Tailwind emerald-400
        light.style.boxShadow = '0 0 8px 2px #34d399';
        label.textContent = 'Carrier detected';
      } else {
        light.style.backgroundColor = '#ef4444'; // Tailwind red-500
        light.style.boxShadow = '0 0 8px 2px #ef4444';
        label.textContent = 'Carrier Not Detected';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Cookie consent logic
      if (!hasConsent() && !hasDeclined()) {
        showBanner();
      } else if (hasConsent()) {
        loadClarity();
      }
      document.getElementById('accept-cookies').onclick = function() {
        localStorage.setItem('clarityConsent', 'accepted');
        hideBanner();
        loadClarity();
      };
      document.getElementById('decline-cookies').onclick = function() {
        localStorage.setItem('clarityConsent', 'declined');
        hideBanner();
      };

      // Carrier detection
      updateCarrierIndicator();
    });
  </script>
</header>
